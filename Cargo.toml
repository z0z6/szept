[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/ffi", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
anyhow = "1"
# aws-lc-rs instead of ring: it has the hybrid post-quantum key exchange
# X25519MLKEM768 (see crates/core/src/crypto.rs).
iroh = { version = "1.4", default-features = false, features = ["metrics", "fast-apple-datapath", "portmapper", "tls-aws-lc-rs"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
