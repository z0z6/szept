[package]
name = "szept-desktop"
description = "Okienkowa aplikacja Szept na Linuksa, Windows i macOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "szept-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
komunikator-ffi = { path = "../ffi" }
serde = { workspace = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-notification = "~2.7.0"

# Lets the scanner use the camera inside WebKitGTK.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[lints]
workspace = true
